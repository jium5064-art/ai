<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>계산기</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;background:#111;font-family:Arial,sans-serif}
.calculator{width:330px;background:#222;padding:20px;border-radius:24px;box-shadow:0 10px 35px #0008}
#display{width:100%;height:75px;border:0;border-radius:14px;margin-bottom:15px;padding:10px 15px;background:#333;color:white;text-align:right;font-size:32px;outline:none}
.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
button{height:60px;border:0;border-radius:15px;font-size:22px;cursor:pointer;background:#444;color:white;transition:.1s}
button:hover{background:#555}button:active{transform:scale(.94)}
.operator{background:#ff9500}.operator:hover{background:#ffad32}
.clear{background:#d33}.equals{background:#28a745}
</style>
</head>
<body>
<div class="calculator">
<input id="display" value="0" readonly>
<div class="buttons">
<button class="clear" onclick="clearDisplay()">C</button><button onclick="backspace()">⌫</button><button onclick="add('%')">%</button><button class="operator" onclick="add('/')">÷</button>
<button onclick="add('7')">7</button><button onclick="add('8')">8</button><button onclick="add('9')">9</button><button class="operator" onclick="add('*')">×</button>
<button onclick="add('4')">4</button><button onclick="add('5')">5</button><button onclick="add('6')">6</button><button class="operator" onclick="add('-')">−</button>
<button onclick="add('1')">1</button><button onclick="add('2')">2</button><button onclick="add('3')">3</button><button class="operator" onclick="add('+')">+</button>
<button onclick="add('0')" style="grid-column:span 2">0</button><button onclick="add('.')">.</button><button class="equals" onclick="calculate()">=</button>
</div></div>
<script>
const display=document.getElementById('display');
function add(value){if(display.value==='0'&&/[0-9.]/.test(value))display.value='';display.value+=value}
function clearDisplay(){display.value='0'}
function backspace(){display.value=display.value.slice(0,-1)||'0'}
function calculate(){try{let exp=display.value.replace(/%/g,'/100');if(!/^[0-9+\-*/.() ]+$/.test(exp))throw Error();let result=Function('"use strict";return ('+exp+')')();if(!Number.isFinite(result))throw Error();display.value=result}catch{display.value='오류'}}
document.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key==='=')calculate();else if(e.key==='Escape')clearDisplay();else if(e.key==='Backspace')backspace();else if(/[0-9.+\-*/%]/.test(e.key))add(e.key)})
</script>
</body>
</html>
